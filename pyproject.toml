[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "job-posting-collector"
version = "0.1.0"
description = "Collects recent job postings from eng-estekhdam.com into SQLite, with a search API and page."
requires-python = ">=3.12"
dependencies = [
    "httpx==0.28.1",
    "beautifulsoup4==4.15.0",
    "lxml==6.1.3",
    "jdatetime==6.1.0",
    "tzdata==2026.5",
    "fastapi==0.142.2",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-playwright==0.9.0",
]

[tool.setuptools]
packages = ["collector", "collector.sources", "api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
